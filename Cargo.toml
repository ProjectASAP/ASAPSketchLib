[package]
name = "asap_sketchlib"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A high-performance sketching library for approximate stream processing"
homepage = "https://projectasap.github.io/"
repository = "https://github.com/ProjectASAP/asap_sketchlib"
documentation = "https://docs.rs/asap_sketchlib"
readme = "README.md"
keywords = ["sketch", "streaming", "approximate", "quantiles", "cardinality"]
categories = ["algorithms", "data-structures"]
autobins = false

[package.metadata.docs.rs]
all-features = true

[dependencies]
rand = "0.9.3"
serde = { version = "1.0", features = ["derive"] }
serde-big-array = "0.5"
serde_bytes = "0.11"
rmp-serde = "1.3.0"
twox-hash = "2.1.2"
smallvec = "1.13.2"
prost = "0.13"
bytes = "1"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
core_affinity = { version = "0.8", optional = true }
crossbeam-channel = { version = "0.5", optional = true }

[dev-dependencies]
core_affinity = "0.8"

[features]
default = []
experimental = []
octo-runtime = ["core_affinity", "crossbeam-channel"]

# Note: there are intentionally no `[build-dependencies]`. The prost output
# under `src/proto/generated/` is checked in and refreshed by the maintainer
# tool at `tools/gen-proto/`. This keeps the published crate pure-Rust with
# no requirement on `protoc` for downstream consumers.

[lib]
crate-type = ["rlib"]
name = "asap_sketchlib"
path = "src/lib.rs"
bench = false

#[profile.release]
#debug = true
#strip = false
#frame-pointer = "can-use"
#lto = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
